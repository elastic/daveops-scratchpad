---
# $yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
steps:
  - label: "Validate Catalog Info"
    command: "/agent/check-catalog-info.sh"
    agents:
      image: "docker.elastic.co/ci-agent-images/pipelib:0.35.0@sha256:4e521947861821d7607b26b95c141f47e6a8794c6b15e53b1813dafea61a557b"
    if_changed:
      - "catalog-info.yaml"

  - label: "Build"
    command: "true"

  - label: "Test"
    command: "true"

  - label: "Deploy"
    command: "true"

  - label: "Publish"
    command: "true"
